syntax = "proto3";

package nagomi.v1;

import "google/protobuf/timestamp.proto";
import "google/type/date.proto";
import "nagomi/v1/enums.proto";

enum StatementStatus {
  STATEMENT_STATUS_UNSPECIFIED = 0;
  STATEMENT_STATUS_PENDING = 1;
  STATEMENT_STATUS_IMPORTED = 2;
}

message Statement {
  int64 id = 1;
  StatementStatus status = 2;
  optional int64 account_id = 3;
  optional string account_name = 4;
  string file_name = 5;
  string parser = 6;
  string bank = 7;
  AccountType account_type = 8;
  string account_number = 9;
  google.type.Date period_start = 10;
  google.type.Date period_end = 11;
  string currency = 12;
  optional int64 opening_balance_cents = 13;
  optional int64 closing_balance_cents = 14;
  int32 line_count = 15;
  google.protobuf.Timestamp created_at = 16;
  optional google.protobuf.Timestamp imported_at = 17;
  // opening balance plus the lines equals the closing balance; unset when the
  // statement's balances couldn't be read
  optional bool balance_ok = 18;
}

enum StatementCoverageStatus {
  STATEMENT_COVERAGE_STATUS_UNSPECIFIED = 0;
  STATEMENT_COVERAGE_STATUS_IMPORTED = 1;
  // imported, but its lines don't add up to its balances
  STATEMENT_COVERAGE_STATUS_UNBALANCED = 2;
  // a gap before the first statement or between two
  STATEMENT_COVERAGE_STATUS_MISSING = 3;
  // came out since the latest statement
  STATEMENT_COVERAGE_STATUS_DUE = 4;
}

// one statement period of an account. missing and due periods are guessed as a
// month from the neighbouring statement.
message StatementCoveragePeriod {
  google.type.Date start = 1;
  google.type.Date end = 2;
  StatementCoverageStatus status = 3;
  // for imported and unbalanced periods
  optional int64 statement_id = 4;
}
