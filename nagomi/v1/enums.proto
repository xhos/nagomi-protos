syntax = "proto3";

package nagomi.v1;

enum AccountType {
  ACCOUNT_UNSPECIFIED = 0;
  ACCOUNT_CHEQUING = 1;
  ACCOUNT_SAVINGS = 2;
  ACCOUNT_CREDIT_CARD = 3;
  ACCOUNT_INVESTMENT = 4;
  ACCOUNT_OTHER = 5;
  ACCOUNT_FRIEND = 6;
}

enum TransactionDirection {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_INCOMING = 1;
  DIRECTION_OUTGOING = 2;
}

enum TransactionSource {
  TRANSACTION_SOURCE_UNSPECIFIED = 0;
  TRANSACTION_SOURCE_MANUAL = 1;
  TRANSACTION_SOURCE_EMAIL = 2;
  TRANSACTION_SOURCE_CONNECTOR = 3;
  TRANSACTION_SOURCE_STATEMENT = 4;
  TRANSACTION_SOURCE_SPLIT = 5;
}

enum TransferStatus {
  TRANSFER_STATUS_UNSPECIFIED = 0;
  // counted as a move between own accounts
  TRANSFER_STATUS_LINKED = 1;
  // a plausible pair the user should confirm
  TRANSFER_STATUS_SUGGESTED = 2;
  // the user said these are not a transfer; never suggested again
  TRANSFER_STATUS_REJECTED = 3;
}

enum TransferMethod {
  TRANSFER_METHOD_UNSPECIFIED = 0;
  // both sides carried the same transfer_ref
  TRANSFER_METHOD_REFERENCE = 1;
  // paired by amount, date and description
  TRANSFER_METHOD_MATCHED = 2;
  TRANSFER_METHOD_MANUAL = 3;
}

enum PeriodType {
  PERIOD_TYPE_UNSPECIFIED = 0;
  PERIOD_TYPE_7_DAYS = 1;
  PERIOD_TYPE_30_DAYS = 2;
  PERIOD_TYPE_90_DAYS = 3;
  PERIOD_TYPE_CUSTOM = 4;
  PERIOD_TYPE_3_MONTHS = 5;
  PERIOD_TYPE_6_MONTHS = 6;
  PERIOD_TYPE_1_YEAR = 7;
  PERIOD_TYPE_ALL_TIME = 8;
}

enum Granularity {
  GRANULARITY_UNSPECIFIED = 0;
  GRANULARITY_DAY = 1;
  GRANULARITY_WEEK = 2;
  GRANULARITY_MONTH = 3;
}
