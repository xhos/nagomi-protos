syntax = "proto3";

package nagomi.v1;

import "nagomi/v1/account.proto";
import "google/type/money.proto";
import "nagomi/v1/enums.proto";
import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "google/type/date.proto";

service AccountService {
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse);
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountResponse);
  rpc AddAccountAlias(AddAccountAliasRequest) returns (AddAccountAliasResponse);
  rpc RemoveAccountAlias(RemoveAccountAliasRequest) returns (RemoveAccountAliasResponse);
  rpc SetAccountAliases(SetAccountAliasesRequest) returns (SetAccountAliasesResponse);
  rpc FindAccountByAlias(FindAccountByAliasRequest) returns (FindAccountByAliasResponse);
  rpc MergeAccounts(MergeAccountsRequest) returns (MergeAccountsResponse);

  rpc ListAccountGroups(ListAccountGroupsRequest) returns (ListAccountGroupsResponse);
  // creates the group and moves the given accounts into it
  rpc CreateAccountGroup(CreateAccountGroupRequest) returns (CreateAccountGroupResponse);
  rpc UpdateAccountGroup(UpdateAccountGroupRequest) returns (UpdateAccountGroupResponse);
  // the accounts stay, ungrouped
  rpc DeleteAccountGroup(DeleteAccountGroupRequest) returns (DeleteAccountGroupResponse);
  // moves accounts into a group, or out of any when group_id is unset. a group
  // left without accounts is deleted
  rpc SetAccountsGroup(SetAccountsGroupRequest) returns (SetAccountsGroupResponse);
}

message ListAccountsRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListAccountsResponse {
  repeated Account accounts = 1;
}

message GetAccountRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
}

message GetAccountResponse {
  Account account = 1;
}

message CreateAccountRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2;
  string bank = 3;
  AccountType type = 4;
  optional string friendly_name = 5;
  google.type.Money anchor_balance = 6;
  string main_currency = 7;
  optional string color = 8 [(buf.validate.field).string.pattern = "^#[0-9a-fA-F]{6}$"];
  bool statement_driven = 9;
}

message CreateAccountResponse {
  Account account = 1;
}

message UpdateAccountRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
  google.protobuf.FieldMask update_mask = 3;

  // fields that can be updated
  optional string name = 4;
  optional string bank = 5;
  optional AccountType account_type = 6;
  optional string friendly_name = 7;
  optional google.protobuf.Timestamp anchor_date = 8;
  optional google.type.Money anchor_balance = 9;
  optional string main_currency = 10;
  optional string color = 11 [(buf.validate.field).string.pattern = "^#[0-9a-fA-F]{6}$"];
  optional bool statement_driven = 12;
  // these two are cleared by naming them in update_mask and leaving them unset
  optional google.type.Date statements_start = 13;
  reserved 14;
  reserved "statement_release_day";
  optional google.type.Date closed_at = 15;
}

message UpdateAccountResponse {}

message DeleteAccountRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
}

message DeleteAccountResponse {
  int64 affected_rows = 1;
}

message AddAccountAliasRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  int64 account_id = 2 [(buf.validate.field).int64.gt = 0];
  string alias = 3 [(buf.validate.field).string.min_len = 1];
}

message AddAccountAliasResponse {}

message RemoveAccountAliasRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  int64 account_id = 2 [(buf.validate.field).int64.gt = 0];
  string alias = 3 [(buf.validate.field).string.min_len = 1];
}

message RemoveAccountAliasResponse {}

message SetAccountAliasesRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  int64 account_id = 2 [(buf.validate.field).int64.gt = 0];
  repeated string aliases = 3;
}

message SetAccountAliasesResponse {}

message FindAccountByAliasRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  string alias = 2 [(buf.validate.field).string.min_len = 1];
}

message FindAccountByAliasResponse {
  Account account = 1;
}

message MergeAccountsRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  int64 primary_account_id = 2 [(buf.validate.field).int64.gt = 0];
  int64 secondary_account_id = 3 [(buf.validate.field).int64.gt = 0];
}

message MergeAccountsResponse {
  Account account = 1;
  int64 transactions_moved = 2;
}

message ListAccountGroupsRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListAccountGroupsResponse {
  repeated AccountGroup groups = 1;
}

message CreateAccountGroupRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 100
  }];
  optional string color = 3 [(buf.validate.field).string.pattern = "^#[0-9a-fA-F]{6}$"];
  repeated int64 account_ids = 4 [(buf.validate.field).repeated.items.int64.gt = 0];
}

message CreateAccountGroupResponse {
  AccountGroup group = 1;
}

message UpdateAccountGroupRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
  optional string name = 3 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 100
  }];
  optional string color = 4 [(buf.validate.field).string.pattern = "^#[0-9a-fA-F]{6}$"];
}

message UpdateAccountGroupResponse {}

message DeleteAccountGroupRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  int64 id = 2 [(buf.validate.field).int64.gt = 0];
}

message DeleteAccountGroupResponse {}

message SetAccountsGroupRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  repeated int64 account_ids = 2 [(buf.validate.field).repeated = {
    min_items: 1,
    items: {int64: {gt: 0}}
  }];
  optional int64 group_id = 3 [(buf.validate.field).int64.gt = 0];
}

message SetAccountsGroupResponse {}
