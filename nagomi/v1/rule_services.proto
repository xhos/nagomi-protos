syntax = "proto3";

package nagomi.v1;

import "nagomi/v1/rule.proto";
import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service RuleService {
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc GetRule(GetRuleRequest) returns (GetRuleResponse);
  rpc CreateRule(CreateRuleRequest) returns (CreateRuleResponse);
  rpc UpdateRule(UpdateRuleRequest) returns (UpdateRuleResponse);
  rpc DeleteRule(DeleteRuleRequest) returns (DeleteRuleResponse);
  rpc SuggestRules(SuggestRulesRequest) returns (SuggestRulesResponse);
}

message ListRulesRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListRulesResponse {
  repeated Rule rules = 1;
}

message GetRuleRequest {
  string rule_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

message GetRuleResponse {
  Rule rule = 1;
}

message CreateRuleRequest {
  option (buf.validate.message).cel = {
    id: "action_required"
    message: "category_id or merchant is required"
    expression: "has(this.category_id) || has(this.merchant)"
  };

  string user_id = 1 [(buf.validate.field).string.uuid = true];
  string rule_name = 2 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 255
  }];
  optional int64 category_id = 3;
  google.protobuf.Struct conditions = 4;
  optional bool apply_to_existing = 5;
  optional string merchant = 6;
  optional int32 priority_order = 7;
}

message CreateRuleResponse {
  Rule rule = 1;
}

message UpdateRuleRequest {
  string rule_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
  google.protobuf.FieldMask update_mask = 3;

  optional string rule_name = 4;
  optional int64 category_id = 5;
  optional google.protobuf.Struct conditions = 6;
  optional bool is_active = 7;
  optional int32 priority_order = 8;
  optional string merchant = 9;
  optional bool apply_to_existing = 10;
}

message UpdateRuleResponse {}

message DeleteRuleRequest {
  string rule_id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2 [(buf.validate.field).string.uuid = true];
}

message DeleteRuleResponse {
  int64 affected_rows = 1;
}

message SuggestRulesRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  optional int32 limit = 2 [(buf.validate.field).int32 = {
    gt: 0,
    lte: 200
  }];
}

// a description pattern shared by many uncategorized transactions
message RuleSuggestion {
  // matched case-insensitively as "description starts with pattern"
  string pattern = 1;
  int64 transaction_count = 2;
  // a few distinct descriptions the pattern matches, most common first
  repeated string examples = 3;
  // the category most already-categorized matches of the pattern have
  optional int64 category_id = 4;
  google.protobuf.Timestamp last_seen = 5;
}

message SuggestRulesResponse {
  repeated RuleSuggestion suggestions = 1;
  int64 uncategorized_count = 2;
}
